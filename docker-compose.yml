services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: geofence
      MYSQL_USER: geofence
      MYSQL_PASSWORD: geofence
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      GEOFENCE_DATABASE_URL: mysql+pymysql://geofence:geofence@mysql:3306/geofence
      GEOFENCE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
